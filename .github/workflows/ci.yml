name: Tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest build
          python -m pip check
      - name: Python syntax and tests
        run: |
          python -m compileall -q agents loinc_snomed_crosswalk_agent cli.py onto_crosswalk.py enrichment.py
          pytest -q
      - name: Browser CSV and XSS regression tests
        run: |
          node --check web/app.js
          node --test tests/browser.test.cjs
      - name: Verify wheel and source distributions
        run: python -m build
      - name: Confirm clean audit signature
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
